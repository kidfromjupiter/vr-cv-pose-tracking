[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vr-led-tracker"
version = "0.1.0"
description = "DroidCam and IMU fusion tracking for a three-sphere VR controller"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "opencv-python>=4.14,<5",
  "pyserial>=3.5,<4",
]

[project.optional-dependencies]
test = ["pytest>=8.3"]

[project.scripts]
vr-led-tracker = "vr_led_tracker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
