<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="297mm"
     height="210mm"
     viewBox="0 0 297 210">
  <title>OpenCV checkerboard — 9 by 6 inner corners, 25 mm squares</title>
  <desc>
    Print on A4 landscape paper at 100 percent or Actual Size. The pattern is
    10 by 7 squares, producing 9 by 6 inner corners. Each square is 25 mm.
  </desc>

  <!-- A4 landscape page. The 250 x 175 mm pattern is centered. -->
  <rect x="0" y="0" width="297" height="210" fill="#fff"/>
  <g fill="#000" shape-rendering="crispEdges">
    <!-- Row 1 -->
    <rect x="23.5"  y="17.5" width="25" height="25"/>
    <rect x="73.5"  y="17.5" width="25" height="25"/>
    <rect x="123.5" y="17.5" width="25" height="25"/>
    <rect x="173.5" y="17.5" width="25" height="25"/>
    <rect x="223.5" y="17.5" width="25" height="25"/>

    <!-- Row 2 -->
    <rect x="48.5"  y="42.5" width="25" height="25"/>
    <rect x="98.5"  y="42.5" width="25" height="25"/>
    <rect x="148.5" y="42.5" width="25" height="25"/>
    <rect x="198.5" y="42.5" width="25" height="25"/>
    <rect x="248.5" y="42.5" width="25" height="25"/>

    <!-- Row 3 -->
    <rect x="23.5"  y="67.5" width="25" height="25"/>
    <rect x="73.5"  y="67.5" width="25" height="25"/>
    <rect x="123.5" y="67.5" width="25" height="25"/>
    <rect x="173.5" y="67.5" width="25" height="25"/>
    <rect x="223.5" y="67.5" width="25" height="25"/>

    <!-- Row 4 -->
    <rect x="48.5"  y="92.5" width="25" height="25"/>
    <rect x="98.5"  y="92.5" width="25" height="25"/>
    <rect x="148.5" y="92.5" width="25" height="25"/>
    <rect x="198.5" y="92.5" width="25" height="25"/>
    <rect x="248.5" y="92.5" width="25" height="25"/>

    <!-- Row 5 -->
    <rect x="23.5"  y="117.5" width="25" height="25"/>
    <rect x="73.5"  y="117.5" width="25" height="25"/>
    <rect x="123.5" y="117.5" width="25" height="25"/>
    <rect x="173.5" y="117.5" width="25" height="25"/>
    <rect x="223.5" y="117.5" width="25" height="25"/>

    <!-- Row 6 -->
    <rect x="48.5"  y="142.5" width="25" height="25"/>
    <rect x="98.5"  y="142.5" width="25" height="25"/>
    <rect x="148.5" y="142.5" width="25" height="25"/>
    <rect x="198.5" y="142.5" width="25" height="25"/>
    <rect x="248.5" y="142.5" width="25" height="25"/>

    <!-- Row 7 -->
    <rect x="23.5"  y="167.5" width="25" height="25"/>
    <rect x="73.5"  y="167.5" width="25" height="25"/>
    <rect x="123.5" y="167.5" width="25" height="25"/>
    <rect x="173.5" y="167.5" width="25" height="25"/>
    <rect x="223.5" y="167.5" width="25" height="25"/>
  </g>
</svg>

